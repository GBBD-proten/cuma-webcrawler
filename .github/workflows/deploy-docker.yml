name: Deploy Docker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Docker login
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Docker and push
      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cuma_webcrawler:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/cuma_webcrawler:latest

      # 4. ssh connect to server
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/cuma_webcrawler:latest
            docker stop cuma_webcrawler || true
            docker rm cuma_webcrawler || true
            docker run ${{ secrets.BACKEND_PATH }}:app/ -d --name cuma_webcrawler -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/cuma_webcrawler:latest
